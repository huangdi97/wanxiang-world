# Optional local services. Local deterministic tests never require Docker.
# PostgreSQL is the production-compatible target; development tests use SQLite.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wanxiang
      POSTGRES_PASSWORD: wanxiang
      POSTGRES_DB: wanxiang
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wanxiang"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
