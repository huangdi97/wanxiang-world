[project]
name = "wanxiang-research"
version = "0.1.0"
description = "Experimental v5.1/v6 research namespace (OFF by default; isolated from stable)."
requires-python = ">=3.12"
dependencies = ["wanxiang-domain"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wanxiang_research"]
