[project]
name = "wanxiang-application"
version = "0.1.0"
description = "Wanxiang application layer: use cases and orchestration ports"
requires-python = ">=3.12"
dependencies = [
    "wanxiang-domain>=0.1.0",
    "wanxiang-runtime>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wanxiang_application"]

[tool.uv.sources]
wanxiang-domain = { workspace = true }
wanxiang-runtime = { workspace = true }
