[project]
name = "wanxiang-runtime"
version = "0.1.0"
description = "Wanxiang runtime: validate/resolve/commit/replay coordination"
requires-python = ">=3.12"
dependencies = ["wanxiang-domain>=0.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wanxiang_runtime"]

[tool.uv.sources]
wanxiang-domain = { workspace = true }
