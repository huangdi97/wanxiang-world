[project]
name = "wanxiang-foundry"
version = "0.1.0"
description = "Wanxiang Capability Foundry: Artifact2Capability candidates, verification and verified registry"
requires-python = ">=3.12"
dependencies = ["wanxiang-execution"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wanxiang_foundry"]
