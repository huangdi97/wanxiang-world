[project]
name = "wanxiang-substrate"
version = "0.1.0"
description = "Wanxiang living-world substrate: spatial, temporal, material, body, institution, population"
requires-python = ">=3.12"
dependencies = [
    "wanxiang-domain>=0.1.0",
    "wanxiang-runtime>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wanxiang_substrate"]

[tool.uv.sources]
wanxiang-domain = { workspace = true }
wanxiang-runtime = { workspace = true }
