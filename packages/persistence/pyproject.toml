[project]
name = "wanxiang-persistence"
version = "0.1.0"
description = "Wanxiang persistence: repositories/event store/snapshot adapters"
requires-python = ">=3.12"
dependencies = [
    "wanxiang-domain>=0.1.0",
    "wanxiang-runtime>=0.1.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wanxiang_persistence"]

[tool.uv.sources]
wanxiang-domain = { workspace = true }
wanxiang-runtime = { workspace = true }
