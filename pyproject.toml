[project]
name = "wanxiang"
version = "0.1.0"
description = "Wanxiang Semantic Persistent Living World OS - monorepo workspace root"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "apps/*"]
exclude = ["packages/sdk_ts"]

[tool.uv.sources]
wanxiang-research = { workspace = true }
wanxiang-domain = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.104",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/_arch_tmp", "tests/_persist_tmp", ".uv-cache", ".git", "__pycache__"]
addopts = "-ra --strict-markers -p no:cacheprovider"
pythonpath = ["."]
markers = [
    "unit: fast pure unit tests",
    "property: property-based tests (hypothesis)",
    "contract: adapter/port contract tests",
    "integration: tests requiring real adapters (sqlite)",
    "architecture: dependency/conformance guards",
    "migration: alembic migration tests",
    "e2e: end-to-end transport tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages", "apps", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ASYNC"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["packages", "apps", "tests", "scripts"]
exclude = ["**/node_modules", "**/.venv", "**/dist", "tests/_arch_tmp", "tests/_persist_tmp", ".uv-cache"]
venvPath = "."
venv = ".venv"
extraPaths = [
    "packages/domain/src",
    "packages/application/src",
    "packages/runtime/src",
    "packages/persistence/src",
    "packages/observability/src",
    "packages/substrate/src",
    "packages/research/src",
    "apps/api/src",
]
